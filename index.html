<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/png" href="/img/logos/favicon.png">

        <!-- Load Python tools -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
        
        <!-- Font Links -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&family=Inika:wght@400;700&family=Uncial+Antiqua&display=swap" rel="stylesheet">

        <!-- CSS Links -->
        <link type="text/css" rel="stylesheet" href="css/global.css">
        <link type="text/css" rel="stylesheet" href="css/index.css">
    </head>
    
    <body>

        <div id="body-content">
            
            <!-- Primary image for the blog on the home page ONLY -->
            <div id="body-img">
                <div id="body-splash" style="background-image: url(img/media/splash.jpg);">
                    <div id="body-logo">
                        <img src="img/logos/the_convert-logo.png">
                    </div>
                </div>
            </div>

            <!-- Primary article list -->
            <div id="body-text">
                <div id="sections">

                    <!-- Section Templates -->
                    <template id="section-template">
                        <div class="section">    
                            <h1 class="section-title">SECTION TITLE</h1>
                            <!-- Entry Here -->    
                        </div>
                    </template>

                    <template id="entry-template">
                        <div class="section-entry">
                            <p class="entry-new">NEW</p>
                            <div class="entry-body">
                                <h3 class="entry-title">ENTRY TITLE</h3>
                                <p class="entry-subtitle">ENTRY SUBTITLE</p>
                            </div>
                            <img class="entry-share" src="img/icons/square-share.png">
                        </div>
                    </template>
                    <!----------------------->

                </div>
             </div>
        </div>

    </body>

    <script src="js/mobile.js"></script>
    <script src="js/index.js"></script>

</html>
