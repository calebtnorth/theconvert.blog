<!DOCTYPE html>
<html>
    <head>
        <link rel="icon" type="image/png" href="/img/logos/favicon.png">

        <!-- Load Python tools -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
        <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
        
        <!-- Font Links -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@100..900&family=Inika:wght@400;700&family=Uncial+Antiqua&display=swap" rel="stylesheet">

        <!-- CSS Links -->
        <link type="text/css" rel="stylesheet" href="css/global.css">
        <link type="text/css" rel="stylesheet" href="css/article.css">
    </head>
    
    <body>

        <div id="body-content">
            
            <!-- Back Button -->
            <a href="/" id="back-button">
                <img src="img/icons/home.png">
            </a>

            <!-- Article overview and buttons -->
            <div id="article-overview">

                <div id="article-overview-heading">
                    <h1 id="article-title">Lorem Ipsum</h1>
                    <p id="article-subtitle">Jan 01 1970</p>
                </div>
                
                <div id="article-overview-buttons">
                    <button id="article-download">Download</button>
                    <button id="article-share">Share</button>
                </div>

            </div>


            <!-- Article content -->
            <div id="article-content">

                <!-- Template -->
                <template id="article-content-paragraphs-template">
                    <div id="article-content-paragraphs">                
                        <p>Lorem Ipsum</p>
                    </div>
                </template>
                <!-------------->

            </div>


        </div>

    </body>

    <script src="js/global.js"></script>
    <script src="js/article.js"></script>

</html>
